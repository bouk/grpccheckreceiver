type: grpccheck

status:
  class: receiver
  stability:
    alpha: [metrics]
  distributions: [contrib]
  codeowners:
    active: [bouk]

resource_attributes:

attributes:
  name:
    description: Human-readable name for the target.
    type: string
  net.peer.name:
    description: Remote hostname or similar.
    type: string
  grpc.endpoint:
    description: gRPC endpoint.
    type: string
  grpc.service:
    description: gRPC health check service name.
    type: string

metrics:
  grpccheck.duration:
    description: Measures the duration of the gRPC health check.
    enabled: true
    stability:
      level: development
    gauge:
      value_type: int
    unit: ms
    attributes: [name, grpc.endpoint, grpc.service, net.peer.name]
  grpccheck.error:
    description: Records errors occurring during gRPC health check.
    enabled: true
    stability:
      level: development
    sum:
      value_type: int
      aggregation_temporality: cumulative
      monotonic: false
    unit: "{error}"
    attributes: [name, grpc.endpoint, grpc.service, net.peer.name]
  grpccheck.status:
    description: 1 if the gRPC health check resulted in a SERVING status, otherwise 0.
    enabled: true
    stability:
      level: development
    sum:
      value_type: int
      aggregation_temporality: cumulative
      monotonic: false
    unit: "1"
    attributes: [name, grpc.endpoint, grpc.service, net.peer.name]
  grpccheck.tls.cert_remaining:
    description: Time in seconds until certificate expiry, as specified by `NotAfter` field in the x.509 certificate. Negative values represent time in seconds since expiration.
    enabled: false
    stability:
      level: development
    gauge:
      value_type: int
    unit: "s"
    attributes: [grpc.endpoint]
